global:
  scrape_interval: 5s

scrape_configs:
  - job_name: load-balancer
    static_configs:
      - targets: ["host.docker.internal:8000"]

  - job_name: backends
    static_configs:
      - targets:
          - "host.docker.internal:9001"
          - "host.docker.internal:9002"
          - "host.docker.internal:9003"